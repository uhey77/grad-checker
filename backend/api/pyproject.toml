[project]
name = "grad-checker-api"
version = "0.1.0"
description = "外部APIとPython内部通信アダプター"
requires-python = ">=3.15,<3.16"
dependencies = [
    "grad-checker-subjects==0.1.0",
    "grad-checker-config==0.1.0",
    "fastapi>=0.135.0,<1.0",
    "pydantic>=2.0,<3.0",
    "sqlmodel>=0.0.37,<0.1",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.41.0,<1.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api_service"
module-root = ""

[tool.uv.sources]
grad-checker-subjects = { path = "../modules/subjects", editable = true }
grad-checker-config = { path = "../config", editable = true }
