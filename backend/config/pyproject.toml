[project]
name = "grad-checker-config"
version = "0.1.0"
description = "バックエンドの環境設定"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grad_checker_config"
module-root = ""
