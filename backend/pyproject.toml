[project]
name = "grad-checker"
version = "0.1.0"
description = "卒業要件チェッカー"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135.0,<1.0",
    "sqlmodel>=0.0.37,<0.1",
    "uvicorn>=0.41.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=9.0.2,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
