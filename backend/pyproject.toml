[project]
name = "grad-checker"
version = "0.1.0"
description = "卒業要件チェッカー"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.135.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlmodel>=0.0.37,<0.1",
    "uvicorn>=0.41.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pre-commit>=4.6.2,<5",
    "pytest>=9.0.2,<10.0",
    "ruff>=0.17.0,<0.18",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "PL", # Pylint
    "UP", # pyupgrade
]
ignore = [
    "B905",    # zip-without-explicit-strict
    "F403",    # undefined-local-with-import-star
    "N812",    # lowercase-imported-as-non-lowercase
    "N999",    # invalid-module-name
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
]

[tool.ty.src]
include = ["app", "tests", "seeds/build_cs_seed.py"]
