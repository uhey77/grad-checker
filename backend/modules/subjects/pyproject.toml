[project]
name = "grad-checker-subjects"
version = "0.1.0"
description = "課程・科目の業務処理とDBアクセス"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pydantic>=2.0,<3.0",
    "sqlmodel>=0.0.37,<0.1",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grad_checker_subjects"
module-root = ""
