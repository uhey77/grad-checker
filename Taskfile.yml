version: '3'

tasks:
  default:
    desc: 利用できるタスクを表示
    cmds:
      - task --list

  setup:
    desc: フロントエンドとバックエンドの依存関係をインストール
    cmds:
      - task: frontend-install
      - task: backend-install

  frontend-install:
    desc: フロントエンドの依存関係をロックファイルからインストール
    dir: frontend
    cmds:
      - npm ci

  backend-install:
    desc: バックエンドの依存関係をロックファイルからインストール
    dir: backend
    cmds:
      - uv sync --locked

  backend-dev:
    desc: バックエンドの開発サーバーを起動
    dir: backend
    cmds:
      - uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 8000

  backend-catalog:
    desc: ローカル確認用の科目一覧APIを有効にして起動
    dir: backend
    env:
      ENABLE_CATALOG_PREVIEW: 'true'
    cmds:
      - uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 8000

  backend-test:
    desc: バックエンドのテストを実行
    dir: backend
    cmds:
      - uv run pytest

  backend-seed:
    desc: CS学部の便覧掲載科目マスタを検証して追加投入
    dir: backend
    cmds:
      - uv run python -m app.seed --file seeds/cs_2026.json

  dev:
    desc: フロントエンドと科目一覧APIを同時に起動
    cmds:
      - node scripts/dev.mjs

  frontend-dev:
    desc: フロントエンドの開発サーバーを起動
    dir: frontend
    cmds:
      - npm run dev

  build:
    desc: フロントエンドをビルド
    dir: frontend
    cmds:
      - npm run build

  preview:
    desc: フロントエンドのビルド結果をプレビュー
    dir: frontend
    cmds:
      - npm run preview
