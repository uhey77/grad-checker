version: '3'

tasks:
  default:
    desc: 利用できるタスクを表示
    cmds:
      - task --list

  check:
    desc: バックエンドとフロントエンドのlint・整形状態・型を検証
    cmds:
      - task: backend-check
      - task: frontend-check

  format:
    desc: バックエンドとフロントエンドのlint自動修正・整形を実行
    cmds:
      - task: backend-format
      - task: frontend-format

  backend-check:
    desc: バックエンドのlint・整形状態・型を検証
    cmds:
      - task: backend-lint
      - task: backend-typecheck

  frontend-check:
    desc: フロントエンドのlint・整形状態・型を検証
    cmds:
      - task: frontend-lint
      - task: frontend-typecheck

  setup:
    desc: フロントエンドとバックエンドの依存関係をインストール
    cmds:
      - task: frontend-install
      - task: backend-install
      - task: pre-commit-install

  frontend-install:
    desc: フロントエンドの依存関係をロックファイルからインストール
    dir: frontend
    cmds:
      - npm ci

  backend-install:
    desc: バックエンドの依存関係をロックファイルからインストール
    dir: backend
    cmds:
      - uv sync --locked

  backend-dev:
    desc: バックエンドの開発サーバーを起動
    dir: backend
    cmds:
      - uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 8000

  backend-catalog:
    desc: ローカル確認用の科目一覧APIを有効にして起動
    dir: backend
    env:
      ENABLE_CATALOG_PREVIEW: 'true'
    cmds:
      - uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 8000

  backend-test:
    desc: バックエンドのテストを実行
    dir: backend
    cmds:
      - uv run pytest

  backend-lint:
    desc: Ruffでバックエンドのlintと整形状態を検証
    dir: backend
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .

  backend-format:
    desc: Ruffでバックエンドのlint自動修正と整形を実行
    dir: backend
    cmds:
      - uv run --locked ruff check --fix .
      - uv run --locked ruff format .

  backend-typecheck:
    desc: tyでバックエンドの型を検証
    dir: backend
    cmds:
      - uv run --locked ty check

  pre-commit-install:
    desc: コミット時のlint・整形・型検証フックを登録
    cmds:
      - uv run --locked --project backend pre-commit install

  pre-commit:
    desc: 全ファイルにpre-commitを実行
    cmds:
      - uv run --locked --project backend pre-commit run --all-files

  backend-seed:
    desc: CS学部の便覧掲載科目データを検証して追加投入
    dir: backend
    cmds:
      - uv run python -m app.seed --file seeds/cs_2026.json

  dev:
    desc: フロントエンドと科目一覧APIを同時に起動
    cmds:
      - node scripts/dev.mjs

  frontend-dev:
    desc: フロントエンドの開発サーバーを起動
    dir: frontend
    cmds:
      - npm run dev

  frontend-lint:
    desc: ESLintとPrettierでフロントエンドを検証
    dir: frontend
    cmds:
      - npm run lint
      - npm run format:check

  frontend-format:
    desc: ESLintの自動修正とPrettierの整形を実行
    dir: frontend
    cmds:
      - npm run lint:fix
      - npm run format

  frontend-typecheck:
    desc: TypeScriptでフロントエンドの型を検証
    dir: frontend
    cmds:
      - npm run typecheck

  build:
    desc: フロントエンドをビルド
    dir: frontend
    cmds:
      - npm run build

  preview:
    desc: フロントエンドのビルド結果をプレビュー
    dir: frontend
    cmds:
      - npm run preview
