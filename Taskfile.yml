version: '3'

tasks:
  default:
    desc: 利用できるタスクを表示
    cmds:
      - task --list

  check:
    desc: バックエンドとフロントエンドのlint・整形状態・型を検証
    cmds:
      - task: backend-check
      - task: frontend-check

  test:
    desc: バックエンドとフロントエンドの全テストを実行
    cmds:
      - task: backend-test
      - task: frontend-test

  format:
    desc: バックエンドとフロントエンドのlint自動修正・整形を実行
    cmds:
      - task: backend-format
      - task: frontend-format

  backend-check:
    desc: バックエンドのlint・整形状態・型を検証
    cmds:
      - task: api-docs-check
      - task: backend-lint
      - task: backend-format-check
      - task: backend-typecheck

  frontend-check:
    desc: フロントエンドのlint・整形状態・型を検証
    cmds:
      - task: frontend-lint
      - task: frontend-format-check
      - task: frontend-typecheck

  setup:
    desc: フロントエンドとバックエンドの依存関係をインストール
    cmds:
      - task: frontend-install
      - task: backend-install
      - task: pre-commit-install

  frontend-install:
    desc: フロントエンドの依存関係をロックファイルからインストール
    dir: frontend
    cmds:
      - npm ci

  backend-install:
    desc: バックエンドの依存関係をロックファイルからインストール
    cmds:
      - uv sync --locked --project backend

  backend-dev:
    desc: Go外部APIとPythonサービスを起動
    cmds:
      - node scripts/dev.mjs --backend-only

  auth-dev:
    desc: ユーザー名認証の画面・バックエンドを起動
    cmds:
      - node scripts/dev.mjs

  backend-subject-list:
    desc: Go外部APIの科目一覧を有効にしてバックエンドを起動
    cmds:
      - node scripts/dev.mjs --backend-only --subject-list-preview

  backend-python-dev:
    desc: Pythonサービスだけを起動
    dir: backend
    cmds:
      - uv run --locked uvicorn apps.bridge.main:app --app-dir . --reload --host 127.0.0.1 --port 8001

  backend-test:
    desc: Python・結合テストとGoの競合検出付きテストを実行
    dir: backend
    cmds:
      - uv run --locked pytest
      - task: go-api-test

  backend-lint:
    desc: Ruffとgo vetでバックエンドのlintを検証
    dir: backend
    cmds:
      - uv run --locked ruff check .
      - go vet ./...

  backend-format-check:
    desc: Ruffとgofmtでバックエンドの整形状態を検証
    dir: backend
    cmds:
      - uv run --locked ruff format --check .
      - node ../scripts/check-go-format.mjs

  backend-format:
    desc: Ruffでバックエンドのlint自動修正と整形を実行
    dir: backend
    cmds:
      - uv run --locked ruff check --fix .
      - uv run --locked ruff format .
      - go fmt ./...

  backend-typecheck:
    desc: tyとgo buildでバックエンドの型を検証
    dir: backend
    cmds:
      - uv run --locked ty check
      - go build ./...

  pre-commit-install:
    desc: コミット時の整形・チェック・全テストのフックを登録
    cmds:
      - uv run --locked --project backend pre-commit install

  pre-commit:
    desc: 全ファイルにpre-commitを実行
    cmds:
      - uv run --locked --project backend pre-commit run --all-files

  backend-seed:
    desc: CS学部の便覧掲載科目データを検証して追加投入
    dir: backend
    cmds:
      - uv run --locked python -m apps.cli seed-subjects --file seeds/cs_2026.json

  backend-requirements-seed:
    desc: 科目マスタ投入後にCS4課程の卒業要件・算入規則を追加投入
    dir: backend
    cmds:
      - uv run --locked python -m apps.cli seed-requirements --file seeds/cs_requirements_2026.json

  backend-requirements-build:
    desc: 照合済み転記と科目シードから卒業要件シードを再生成
    dir: backend
    cmds:
      - uv run --locked python seeds/build_cs_requirements_seed.py

  dev:
    desc: フロントエンドと科目一覧APIを同時に起動
    cmds:
      - node scripts/dev.mjs

  frontend-dev:
    desc: フロントエンドの開発サーバーを起動
    dir: frontend
    cmds:
      - npm run dev

  dev-go:
    desc: devと同じ構成で起動（互換コマンド）
    cmds:
      - task: dev

  go-api-dev:
    desc: Go外部APIだけを起動（科目一覧有効）
    dir: backend
    cmds:
      - go run ./apps/api -subject-list-preview

  go-api-check:
    desc: Goの整形状態・静的解析を検証
    cmds:
      - node scripts/check-go-format.mjs
      - go -C backend vet ./...

  go-api-format:
    desc: Goコードを整形
    dir: backend
    cmds:
      - go fmt ./...

  go-api-test:
    desc: Goの入力検証・エラー変換・ブリッジ通信をテスト
    dir: backend
    cmds:
      - go test -race ./...

  frontend-test:
    desc: フロントエンドのテストを実行
    dir: frontend
    cmds:
      - npm test

  frontend-lint:
    desc: ESLintでフロントエンドのlintを検証
    dir: frontend
    cmds:
      - npm run lint

  frontend-format-check:
    desc: Prettierでフロントエンドの整形状態を検証
    dir: frontend
    cmds:
      - npm run format:check

  frontend-format:
    desc: ESLintの自動修正とPrettierの整形を実行
    dir: frontend
    cmds:
      - npm run lint:fix
      - npm run format

  frontend-typecheck:
    desc: TypeScriptでフロントエンドの型を検証
    dir: frontend
    cmds:
      - npm run typecheck

  build:
    desc: フロントエンドをビルド
    dir: frontend
    cmds:
      - npm run build

  preview:
    desc: フロントエンドのビルド結果をプレビュー
    dir: frontend
    cmds:
      - npm run preview

  api-docs:
    desc: Go公開APIのSwagger UIを画面と同じOriginで起動
    cmds:
      - node scripts/dev.mjs --api-docs

  api-docs-build:
    desc: Go公開APIのOpenAPIを再生成
    dir: backend
    cmds:
      - uv run --locked python -m scripts.build_openapi

  api-docs-check:
    desc: OpenAPIの生成差分・構文・公開契約を検証
    dir: backend
    cmds:
      - uv run --locked python -m scripts.build_openapi --check
      - uv run --locked pytest tests/contract/test_openapi.py

  benchmark-graduation:
    desc: 200科目の卒業判定Go API性能計測
    dir: backend
    cmds:
      - uv run --locked python -m scripts.benchmark_graduation --iterations 10


  backend-all-seed:
    desc: CS既存シードを先に投入し、全学部・大学院の各追加シードを原子的に順番に投入
    dir: backend
    cmds:
      - task: backend-seed
      - task: backend-requirements-seed
      - uv run --locked python -m apps.cli seed-subjects --file seeds/university_2026.json
      - uv run --locked python -m apps.cli seed-requirements --file seeds/university_requirements_2026.json

  backend-all-seed-build:
    desc: 保存済みの公式表転記から全課程の追加シードを再生成
    dir: backend
    cmds:
      - uv run --locked python -m seeds.build_university_seed
