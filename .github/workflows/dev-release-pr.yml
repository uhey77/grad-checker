name: Create dev to main PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: false

jobs:
  create-pr:
    if: github.repository == 'uhey77/grad-checker' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Create PR when needed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing_prs() {
            gh api --method GET "repos/$GH_REPO/pulls" \
              -f state=open -f base=main -f head=uhey77:dev --jq 'length'
          }
          existing_count=$(existing_prs)
          if [ "$existing_count" -gt 0 ]; then
            echo 'dev to main PR already exists; its head updates automatically.'
            exit 0
          fi
          comparison=$(gh api "repos/$GH_REPO/compare/main...dev" --jq '[.ahead_by, (.files | length)] | @tsv')
          IFS=$'\t' read -r ahead files <<< "$comparison"
          if [ "$ahead" -eq 0 ] || [ "$files" -eq 0 ]; then
            echo 'There are no dev changes to propose.'
            exit 0
          fi
          cat > "$RUNNER_TEMP/dev-to-main-pr.md" <<'EOF'
          ## リリース前の確認

          - dev にまとめた変更、最新の差分、CI を確認する。
          - 本番 DB や設定への対応が必要な場合は、内容と影響を確認する。
          - main へのマージは手動で行う。マージ後のデプロイと Release Please の状態を確認する。
          EOF
          if gh api --method POST "repos/$GH_REPO/pulls" \
            -f title='dev の変更をまとめてリリースする' \
            -f head=dev -f base=main -F "body=@$RUNNER_TEMP/dev-to-main-pr.md"; then
            echo 'Created dev to main PR.'
          else
            existing_count=$(existing_prs)
            if [ "$existing_count" -gt 0 ]; then
              echo 'A dev to main PR was created concurrently.'
            else
              echo 'Could not create the dev to main PR.' >&2
              exit 1
            fi
          fi
