name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Install Python
        run: uv python install
        working-directory: backend

      - name: Install dependencies
        run: make backend-install

      - name: Run backend checks
        run: make backend-check

      - name: Run Go tests
        run: make go-api-test

  frontend:
    name: Frontend / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, format-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-install

      - name: Run check
        run: make frontend-${{ matrix.check }}
