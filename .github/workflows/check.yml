name: Check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:
    inputs:
      audit_vercel:
        description: Run only the explicitly requested read-only Vercel token audit
        type: boolean
        default: false
      expected_sha:
        description: Exact reviewed commit SHA (required for the token audit)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit_vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: grad_checker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/grad_checker_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: '24'}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: {go-version: '1.25.x'}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: '0.13.1'}
      - run: uv python install && uv sync --locked
        working-directory: backend
      - run: make backend-check
      - run: make backend-test
  frontend:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit_vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: make frontend-check frontend-test build
      - run: node --test scripts/deployment/test-*.mjs
  container:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit_vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with: {version: '0.13.1'}
      - run: uv python install && uv sync --locked
        working-directory: backend
      - run: python3 -m unittest discover -s scripts/deployment -p 'test_initial*.py'
      - run: docker build -t grad-checker-production:test .
      - run: uv run --locked --project backend python scripts/deployment/test_container.py
  vercel-audit:
    # PR・workflow_callでは実行しない。WIF・DB Secret・公開コマンドも使わない。
    if: github.event_name == 'workflow_dispatch' && inputs.audit_vercel && github.repository == 'uhey77/grad-checker' && github.ref == 'refs/heads/feat/production-deployment' && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Read only the fixed Vercel project with the existing GitHub Secret
        run: node scripts/deployment/audit-vercel-project.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
