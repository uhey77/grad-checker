name: Production deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: ci
    # 初回公開承認前は未設定のまま。environmentのrequired reviewersも別途必須。
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: '65.2.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Verify approval policy before any cloud authentication
        run: node scripts/deployment/check-release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate fixed deployment target
        shell: bash
        run: |
          test "$GCP_PROJECT_ID" = grad-checker-512505
          test "$GCP_REGION" = asia-northeast1
          test "$GCP_ARTIFACT_REPOSITORY" = grad-checker
          test "$GCP_CLOUD_RUN_SERVICE" = grad-checker-api
          test "$GCP_SERVICE_ACCOUNT" = grad-checker-deployer@grad-checker-512505.iam.gserviceaccount.com
          test "$GCP_WIF_PROVIDER" = projects/602914367926/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          test "$VERCEL_ORG_ID" = team_tZDGBnNdyZxvlZvkV86h6SGv
          test "$VERCEL_PROJECT_ID" = prj_QgFMi1xMYgrYLGPI1Yi9h0kdkNzW
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify WIF access to existing resources
        run: |
          gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY" --location "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(name)'
          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(metadata.name)'
      - name: Build and push immutable commit image
        run: |
          set -euo pipefail
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/api:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$image" .
          docker push "$image"
          echo "DEPLOY_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy Cloud Run without migrations or IAM changes
        run: |
          set -euo pipefail
          python scripts/deployment/render_cloud_run.py > "$RUNNER_TEMP/cloud-run.yaml"
          gcloud run services replace "$RUNNER_TEMP/cloud-run.yaml" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet
          api_origin=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')
          CLOUD_RUN_API_ORIGIN="$api_origin" node --input-type=module -e 'const u=new URL(process.env.CLOUD_RUN_API_ORIGIN); if(u.protocol!=="https:" || !u.hostname.endsWith(".run.app")) process.exit(1)'
          echo "CLOUD_RUN_API_ORIGIN=$api_origin" >> "$GITHUB_ENV"
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$api_origin/api/ready"
      - name: Install fixed Vercel CLI
        run: npm install -g "vercel@$VERCEL_CLI_VERSION"
      - name: Inspect existing Vercel target without creating a project
        run: vercel project inspect grad-checker --scope "$VERCEL_ORG_ID" --non-interactive
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Pull existing Vercel project settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Reject server credentials and check target before frontend build
        run: node scripts/deployment/verify-frontend-env.mjs
      - name: Build Vercel production output
        run: vercel build --prod
      - name: Stage Vercel production deployment
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --skip-domain)
          DEPLOYMENT_URL="$url" node --input-type=module -e 'const u=new URL(process.env.DEPLOYMENT_URL); if(u.protocol!=="https:" || !u.hostname.endsWith(".vercel.app")) process.exit(1)'
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify staged proxy and SPA before promotion
        run: |
          vercel curl /api/ready --deployment "$DEPLOYMENT_URL" -- --fail --retry 6 --retry-delay 5
          vercel curl /acceptance-check --deployment "$DEPLOYMENT_URL" -- --fail --output "$RUNNER_TEMP/frontend.html"
          grep -q 'id="root"' "$RUNNER_TEMP/frontend.html"
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Promote tested frontend
        run: vercel promote "$DEPLOYMENT_URL" --yes
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify production frontend and API proxy
        run: |
          curl --fail --retry 6 --retry-delay 5 https://grad-checker-chi.vercel.app/api/ready
          curl --fail https://grad-checker-chi.vercel.app/acceptance-check -o "$RUNNER_TEMP/production.html"
          grep -q 'id="root"' "$RUNNER_TEMP/production.html"
