name: Database connectivity (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-database-connectivity
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '24'}
      - run: node scripts/deployment/check-release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: astral-sh/setup-uv@v10.3.0
        with: {version: '0.13.6'}
      - run: uv python install && uv sync --locked
        working-directory: backend
      - name: Check pooled GitHub Secret without reading application data
        run: uv run --locked python -m scripts.check_database --connection-only
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Check direct GitHub Secret in isolated read-only step
        run: uv run --locked python -m scripts.check_database --connection-only
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
