name: Initial private production service
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main SHA (creates private service only)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  ci:
    if: github.repository == 'uhey77/grad-checker' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    uses: ./.github/workflows/check.yml
  create:
    needs: ci
    if: github.repository == 'uhey77/grad-checker' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Verify protected production policy and disabled automatic publication
        run: |
          test "$REPO_DEPLOY_FLAG" != true
          node scripts/deployment/check-release-policy.mjs
          python3 -m unittest discover -s scripts/deployment -p 'test_initial*.py'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_DEPLOY_FLAG: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with: {version: '0.13.1'}
      - run: uv python install && uv sync --locked
        working-directory: backend
      - name: Build fixed source image without production credentials
        run: docker build -t "asia-northeast1-docker.pkg.dev/grad-checker-512505/grad-checker/api:$GITHUB_SHA" .
      - name: Test image with isolated local TLS database
        run: uv run --locked --project backend python scripts/deployment/test_container.py "asia-northeast1-docker.pkg.dev/grad-checker-512505/grad-checker/api:$GITHUB_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: grad-checker-512505
          workload_identity_provider: projects/602914367926/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: grad-checker-deployer@grad-checker-512505.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Push tested image and atomically create private digest-fixed service
        id: service
        run: python3 scripts/deployment/initial_cloud_run.py create
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: invocation
        with:
          project_id: grad-checker-512505
          workload_identity_provider: projects/602914367926/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: grad-checker-deployer@grad-checker-512505.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.uri }}
          id_token_include_email: true
      - name: Verify authenticated readiness and rejected anonymous access
        run: python3 scripts/deployment/initial_cloud_run.py probe
        env:
          SERVICE_URI: ${{ steps.service.outputs.uri }}
          SERVICE_ID_TOKEN: ${{ steps.invocation.outputs.id_token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-cloud-run-evidence
          path: |
            ${{ runner.temp }}/initial-cloud-run.json
            ${{ runner.temp }}/initial-result.json
          retention-days: 7
          if-no-files-found: ignore
