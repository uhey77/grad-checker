name: Production preflight (read only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-preflight
  cancel-in-progress: false
jobs:
  database:
    if: github.repository == 'uhey77/grad-checker' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '24'}
      - run: node scripts/deployment/check-release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: astral-sh/setup-uv@v10.3.0
        with: {version: '0.13.6'}
      - run: uv python install && uv sync --locked
        working-directory: backend
      - name: Verify both GitHub Secrets against the migrated production database
        run: uv run --locked python -m scripts.check_release_database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
  wif:
    needs: database
    if: github.repository == 'uhey77/grad-checker' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '24'}
      - run: node scripts/deployment/check-release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: grad-checker-512505
          workload_identity_provider: projects/602914367926/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: grad-checker-deployer@grad-checker-512505.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Read existing registry and Cloud Run inventory without creating resources
        run: |
          gcloud artifacts repositories describe grad-checker --location asia-northeast1 --project grad-checker-512505 --format='value(name)'
          gcloud run services list --region asia-northeast1 --project grad-checker-512505 --filter='metadata.name=grad-checker-api' --format='value(metadata.name)'
