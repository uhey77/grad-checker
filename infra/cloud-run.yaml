apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: grad-checker-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: '1'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'false'
    spec:
      serviceAccountName: grad-checker-runtime@grad-checker-512505.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 30
      containers:
        - image: IMAGE_TO_RENDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: PUBLIC_ORIGIN
              value: https://grad-checker-chi.vercel.app
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grad-checker-database-url
                  key: '1'
          startupProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 4
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            timeoutSeconds: 1
            periodSeconds: 30
            failureThreshold: 3
